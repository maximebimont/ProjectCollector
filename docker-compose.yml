services:
  postgres:
    image: postgres:16
    container_name: collector_postgres
    restart: always
    environment:
      POSTGRES_DB: vintage_marketplace
      POSTGRES_USER: vintage_user
      POSTGRES_PASSWORD: vintage_password
    ports:
      - "5433:5432"
    volumes:
      - vintage_marketplace_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collector_backend
    restart: always
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vintage_marketplace
      SPRING_DATASOURCE_USERNAME: vintage_user
      SPRING_DATASOURCE_PASSWORD: vintage_password
      APP_JWT_SECRET: ZmFrZVNlY3JldEtleUZvclNjaG9vbFByb2plY3RNdXN0QmVMb25nRW5vdWdoMzI=
      APP_JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: collector_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "4200:8080"

  gateway:
    image: nginx:1.27-alpine
    container_name: collector_gateway
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/gateway/certs:/etc/nginx/certs:ro

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: collector_prometheus
    restart: always
    depends_on:
      - backend
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.4.0
    container_name: collector_grafana
    restart: always
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  vintage_marketplace_data:
  prometheus_data:
  grafana_data:
