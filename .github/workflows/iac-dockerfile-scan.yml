name: Reusable IaC Dockerfile Scan

on:
  workflow_call:

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  secure-iac-dockerfile-scan:
    name: IaC Security Checkov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov on Dockerfiles
        uses: bridgecrewio/checkov-action@d9d1e5cdc53e3a91f0c4c58db7bc19ee31cac7e5 # v12
        with:
          directory: .
          framework: dockerfile
          output_format: sarif
          output_file_path: checkov-report.sarif
          soft_fail: true

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov-report.sarif/results_sarif.sarif
          category: checkov-dockerfile
        continue-on-error: true

      - name: Upload Checkov report artifact
        if: always() && hashFiles('checkov-report.sarif/results_sarif.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov-report.sarif/results_sarif.sarif
          retention-days: 7

      - name: Publish Checkov summary
        if: always() && hashFiles('checkov-report.sarif/results_sarif.sarif') != ''
        run: |
          COUNT=$(jq '[.runs[].results[]] | length' checkov-report.sarif/results_sarif.sarif)
          echo "**Checkov (Dockerfiles) : ${COUNT} recommandation(s) remontee(s)**" >> "$GITHUB_STEP_SUMMARY"