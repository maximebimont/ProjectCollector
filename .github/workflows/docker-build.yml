name: Reusable Docker Build

on:
  workflow_call:

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: collector-backend:ci
          cache-from: type=gha,scope=collector-backend
          cache-to: type=gha,scope=collector-backend,mode=max

      - name: Build frontend Docker image
        if: hashFiles('frontend/Dockerfile') != ''
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: collector-frontend:ci
          cache-from: type=gha,scope=collector-frontend
          cache-to: type=gha,scope=collector-frontend,mode=max

      - name: Run Trivy backend image scan
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/workspace \
            aquasec/trivy:0.69.3 \
            image \
            --format sarif \
            --output /workspace/trivy-backend-results.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --skip-version-check \
            collector-backend:ci

      - name: Upload backend Trivy SARIF
        if: always() && hashFiles('trivy-backend-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend-results.sarif
          category: trivy-backend-container-scan
        continue-on-error: true

      - name: Display backend Trivy findings
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3 \
            image \
            --format table \
            --exit-code 0 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --skip-version-check \
            collector-backend:ci

      - name: Fail on backend image vulnerabilities
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3 \
            image \
            --format table \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --skip-version-check \
            collector-backend:ci

      - name: Run Trivy frontend image scan
        if: hashFiles('frontend/Dockerfile') != ''
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/workspace \
            aquasec/trivy:0.69.3 \
            image \
            --format sarif \
            --output /workspace/trivy-frontend-results.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --skip-version-check \
            collector-frontend:ci

      - name: Upload frontend Trivy SARIF
        if: always() && hashFiles('trivy-frontend-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-frontend-results.sarif
          category: trivy-frontend-container-scan

      - name: Display frontend Trivy findings
        if: hashFiles('frontend/Dockerfile') != ''
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3 \
            image \
            --format table \
            --exit-code 0 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --skip-version-check \
            collector-frontend:ci

      - name: Fail on frontend image vulnerabilities
        if: hashFiles('frontend/Dockerfile') != ''
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3 \
            image \
            --format table \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --skip-version-check \
            collector-frontend:ci
