name: Reusable Docker Build

on:
  workflow_call:

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: collector-backend:ci
          cache-from: type=gha,scope=collector-backend
          cache-to: type=gha,scope=collector-backend,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: collector-frontend:ci
          cache-from: type=gha,scope=collector-frontend
          cache-to: type=gha,scope=collector-frontend,mode=max

      - name: Run Trivy scan for backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: collector-backend:ci
          format: sarif
          output: trivy-backend-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload backend Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend-results.sarif
          category: trivy-backend-container-scan

      - name: Display backend Trivy findings
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: collector-backend:ci
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Fail on backend image vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: collector-backend:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Run Trivy scan for frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: collector-frontend:ci
          format: sarif
          output: trivy-frontend-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload frontend Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend-results.sarif
          category: trivy-frontend-container-scan

      - name: Display frontend Trivy findings
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: collector-frontend:ci
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Fail on frontend image vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: collector-frontend:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
