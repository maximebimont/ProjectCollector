name: Reusable Code Quality and SAST

on:
  workflow_call:
    secrets:
      SEMGREP_APP_TOKEN:
        required: false

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  code-quality-sast:
    name: Code Quality and SAST
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Semgrep SAST
        # returntocorp/semgrep-action@v1 est abandonne et incompatible avec
        # les CLI Semgrep recentes (crash "invalid rule severity value:
        # MEDIUM"), ce que continue-on-error masquait silencieusement.
        # Appel direct de la CLI a la place.
        working-directory: .
        continue-on-error: true
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config auto --sarif --output semgrep.sarif .

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        continue-on-error: true

      - name: Upload Semgrep report artifact
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
          retention-days: 7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin,javascript-typescript
          queries: security-extended,security-and-quality

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend for CodeQL
        run: mvn clean compile -DskipTests=true

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-java
        continue-on-error: true
