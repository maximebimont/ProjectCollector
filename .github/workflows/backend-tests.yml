name: Reusable Backend Tests

on:
  workflow_call:

jobs:
  backend-tests:
    name: Backend Build and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Compile backend
        run: mvn clean compile

      - name: Run backend tests
        run: mvn test

      - name: Publish coverage summary
        if: always() && hashFiles('backend/target/site/jacoco/jacoco.csv') != ''
        run: |
          awk -F',' 'NR>1 { covered+=$5; missed+=$4 } END {
            if (covered+missed>0) {
              printf "**Couverture d'\''instructions backend (JaCoCo) : %.1f%%**\n", (covered/(covered+missed))*100
            }
          }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JaCoCo coverage report
        if: always() && hashFiles('backend/target/site/jacoco/jacoco.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco
          retention-days: 7

      - name: Package backend
        run: mvn package -DskipTests
