name: 🚀 CollectorShop DevSecOps Pipeline

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'

  workflow_dispatch:

  schedule:
    - cron: '0 2 * * 1'

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  backend-tests:
    name: 🧪 Backend tests
    uses: ./.github/workflows/backend-tests.yml

  frontend-build:
    name: 🎨 Frontend build
    uses: ./.github/workflows/frontend-build.yml

  code-quality-sast:
    name: 🔍 Code quality & SAST
    uses: ./.github/workflows/code-quality-sast.yml
    secrets: inherit

  secret-scanning:
    name: 🔐 Secret scanning
    uses: ./.github/workflows/secret-scanning.yml

  secure-iac-dockerfile-scan:
    name: 🛡️ Dockerfile / IaC scan
    uses: ./.github/workflows/iac-dockerfile-scan.yml

  docker-build:
    name: 🐳 Docker build & image scan
    needs:
      - backend-tests
      - frontend-build
    uses: ./.github/workflows/docker-build.yml
