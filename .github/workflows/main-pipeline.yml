name: 🚀 CollectorShop DevSecOps Pipeline

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'

  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'

  workflow_dispatch:

  schedule:
    - cron: '0 6 * * 1'

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  backend-tests:
    name: 🧪 Backend tests
    uses: ./.github/workflows/backend-tests.yml

  frontend-build:
    name: 🎨 Frontend build
    uses: ./.github/workflows/frontend-build.yml

  code-quality-sast:
    name: 🔍 Code quality & SAST
    uses: ./.github/workflows/code-quality-sast.yml
    secrets: inherit

  sonar-scan:
    name: 📊 SonarCloud scan
    uses: ./.github/workflows/sonar-scan.yml
    secrets: inherit

  secret-scanning:
    name: 🔐 Secret scanning
    uses: ./.github/workflows/secret-scanning.yml

  secure-iac-dockerfile-scan:
    name: 🛡️ Dockerfile / IaC scan
    uses: ./.github/workflows/iac-dockerfile-scan.yml

  docker-build:
    name: 🐳 Docker build & image scan
    needs:
      - backend-tests
      - frontend-build
    uses: ./.github/workflows/docker-build.yml

  pipeline-summary:
    name: 📋 Pipeline summary
    if: always()
    needs:
      - backend-tests
      - frontend-build
      - code-quality-sast
      - sonar-scan
      - secret-scanning
      - secure-iac-dockerfile-scan
      - docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Write pipeline summary
        run: |
          {
            echo "## 🚀 CollectorShop DevSecOps Pipeline — Résumé"
            echo ""
            echo "| Job | Rôle | Bloquant | Résultat |"
            echo "|---|---|---|---|"
            echo "| 🧪 Backend tests | compile, tests, package Maven | oui | ${{ needs.backend-tests.result }} |"
            echo "| 🎨 Frontend build | build + tests unitaires + E2E Angular | oui | ${{ needs.frontend-build.result }} |"
            echo "| 🔍 Code quality & SAST | Semgrep + CodeQL | non | ${{ needs.code-quality-sast.result }} |"
            echo "| 📊 SonarCloud scan | qualité de code + Quality Gate | non | ${{ needs.sonar-scan.result }} |"
            echo "| 🔐 Secret scanning | Gitleaks | oui | ${{ needs.secret-scanning.result }} |"
            echo "| 🛡️ Dockerfile / IaC scan | Checkov | non | ${{ needs.secure-iac-dockerfile-scan.result }} |"
            echo "| 🐳 Docker build & image scan | build images + Trivy | non | ${{ needs.docker-build.result }} |"
            echo ""
            echo "Les résultats détaillés des scans SARIF (Semgrep, CodeQL, Checkov, Trivy) sont disponibles dans l'onglet [Security > Code scanning](${{ github.server_url }}/${{ github.repository }}/security/code-scanning) de ce dépôt."
            echo ""
            echo "Le dashboard SonarCloud (qualité de code, couverture, duplication) est disponible sur [sonarcloud.io](https://sonarcloud.io/project/overview?id=maximebimont_ProjectCollector) une fois \`SONAR_TOKEN\` configuré (sinon le job est ignoré, voir docs/security-and-devsecops.md)."
            echo ""
            echo "Le scan de dépendances (OWASP Dependency-Check + Trivy filesystem) est planifié séparément chaque semaine via \`backend-security.yml\`, afin de ne pas ralentir cette pipeline à chaque push."
          } >> "$GITHUB_STEP_SUMMARY"
