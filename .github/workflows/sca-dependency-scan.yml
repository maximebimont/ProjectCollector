name: Reusable SCA Dependency Scan

on:
  workflow_call:
    secrets:
      NVD_API_KEY:
        required: false

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  sca-dependency-scan:
    name: SCA Dependency Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ runner.os }}
          restore-keys: |
            dependency-check-data-${{ runner.os }}

      - name: Check NVD API key availability
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "${NVD_API_KEY}" ]; then
            echo "NVD API key configured."
          else
            echo "NVD API key not configured. Dependency database download may be slower."
          fi

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: true
        run: |
          ARGS="-DfailBuildOnCVSS=9 -Dformats=HTML,SARIF -DossIndexWarnOnlyOnRemoteErrors=true"
          if [ -f ../.owasp-suppressions.xml ]; then
            ARGS="${ARGS} -DsuppressionFiles=../.owasp-suppressions.xml"
          fi

          if [ -n "${NVD_API_KEY}" ]; then
            mvn org.owasp:dependency-check-maven:check ${ARGS} -DnvdApiKey=${NVD_API_KEY}
          else
            mvn org.owasp:dependency-check-maven:check ${ARGS}
          fi

      - name: Upload OWASP Dependency-Check SARIF
        if: always() && hashFiles('backend/target/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: backend/target/dependency-check-report.sarif
          category: owasp-dependency-check
        continue-on-error: true

      - name: Upload OWASP Dependency-Check report
        if: always() && hashFiles('backend/target/dependency-check-report.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
          retention-days: 7

      - name: Run Trivy filesystem scan
        continue-on-error: true
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            aquasec/trivy:0.69.3 \
            fs \
            --format sarif \
            --output /workspace/trivy-fs-results.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --skip-version-check \
            /workspace

      - name: Upload Trivy filesystem SARIF
        if: always() && hashFiles('trivy-fs-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem-scan
        continue-on-error: true

      - name: Upload Trivy filesystem report
        if: always() && hashFiles('trivy-fs-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-results.sarif
          retention-days: 7
