# Config SonarCloud pour le monorepo Collector.shop (backend Java + frontend TypeScript).
#
# projectKey/organization ci-dessous suivent la convention par defaut de
# SonarCloud lors de l'import d'un repo GitHub ("<organisation>_<repo>" /
# "<organisation>"). A verifier/ajuster une fois le projet cree sur
# sonarcloud.io (page "Information" du projet) si les valeurs generees
# different.
sonar.projectKey=maximebimont_ProjectCollector
sonar.organization=maximebimont

sonar.sources=backend/src/main,frontend/src
sonar.tests=backend/src/test,frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*Test.java

sonar.java.binaries=backend/target/classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info

sonar.exclusions=frontend/dist/**,frontend/coverage/**,frontend/e2e/**,backend/target/**
