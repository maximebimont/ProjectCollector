spring:
  application:
    name: vintage-marketplace

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/vintage_marketplace}
    username: ${SPRING_DATASOURCE_USERNAME:vintage_user}
    password: ${SPRING_DATASOURCE_PASSWORD:vintage_password}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration: ${APP_JWT_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

info:
  app:
    name: Collector Backend
    description: Backend Spring Boot pour la marketplace Collector
    version: 1.0.0
    environment: local-dev
