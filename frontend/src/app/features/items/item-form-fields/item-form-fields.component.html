<div [formGroup]="form">
  <div class="form-group">
    <label for="title">Titre</label>
    <input
      id="title"
      type="text"
      formControlName="title"
      placeholder="Nom de l'objet"
    />
    <small *ngIf="form.controls.title.touched && form.controls.title.invalid">
      Le titre est obligatoire.
    </small>
  </div>

  <div class="form-group">
    <label for="description">Description</label>
    <textarea
      id="description"
      formControlName="description"
      rows="5"
      placeholder="Décrivez l'objet, son état et son histoire"
    ></textarea>
    <small *ngIf="form.controls.description.touched && form.controls.description.invalid">
      La description est obligatoire.
    </small>
  </div>

  <div class="form-group">
    <label for="price">Prix</label>
    <input
      id="price"
      type="number"
      formControlName="price"
      min="0.01"
      step="0.01"
      placeholder="59.90"
    />
    <small *ngIf="form.controls.price.touched && form.controls.price.hasError('required')">
      Le prix est obligatoire.
    </small>
    <small *ngIf="form.controls.price.touched && form.controls.price.hasError('min')">
      Le prix doit être supérieur à 0.
    </small>
  </div>

  <div class="form-group">
    <label for="imageUrl">URL d'image</label>
    <input
      id="imageUrl"
      type="url"
      formControlName="imageUrl"
      placeholder="https://exemple.com/image.jpg"
    />
  </div>
</div>
