<main class="page-shell form-page">
  <section class="content-card form-card">
    <p class="page-kicker">Mon espace / Modifier un objet</p>
    <h1 class="section-title">Modifier un objet</h1>
    <p class="intro section-copy">
      Mettez à jour les informations de votre objet de collection.
    </p>

    <div *ngIf="isPageLoading" class="state">
      Chargement de l'objet...
    </div>

    <div *ngIf="loadErrorMessage" class="error">
      {{ loadErrorMessage }}
    </div>

    <form *ngIf="!isPageLoading && !loadErrorMessage" [formGroup]="itemForm" (ngSubmit)="onSubmit()">
      <app-item-form-fields [form]="itemForm"></app-item-form-fields>

      <div class="error" *ngIf="formErrorMessage">
        {{ formErrorMessage }}
      </div>

      <div class="form-actions">
        <a class="back-link" routerLink="/my-items">
          Retour à mes objets
        </a>

        <button type="submit" [disabled]="isSaving">
          {{ isSaving ? 'Enregistrement...' : 'Enregistrer les modifications' }}
        </button>
      </div>
    </form>
  </section>
</main>
