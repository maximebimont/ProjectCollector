<div class="auth-container">
  <div class="auth-card">
    <h1>Connexion</h1>
    <p>Connectez-vous pour acheter ou vendre des objets de collection.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="exemple@email.com" />

        <small *ngIf="loginForm.controls.email.touched && loginForm.controls.email.invalid">
          Email obligatoire et valide.
        </small>
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" formControlName="password" placeholder="Votre mot de passe" />

        <small *ngIf="loginForm.controls.password.touched && loginForm.controls.password.invalid">
          Mot de passe obligatoire.
        </small>
      </div>

      <div class="error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <p class="switch-link">
      Pas encore de compte ?
      <a routerLink="/register">Créer un compte</a>
    </p>
  </div>
</div>
