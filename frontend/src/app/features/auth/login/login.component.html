<main class="page-shell flex min-h-[calc(100vh-6rem)] items-center justify-center">
  <p-card styleClass="content-card w-full max-w-md overflow-hidden">
    <ng-template pTemplate="header">
      <div class="bg-gradient-to-r from-amber-100 via-white to-emerald-50 px-8 pb-4 pt-8">
        <p class="page-kicker">Bienvenue</p>
        <h1 class="section-title m-0">Connexion</h1>
        <p class="section-copy mb-0 mt-3">
          Connectez-vous pour acheter ou vendre des objets de collection.
        </p>
      </div>
    </ng-template>

    <form class="space-y-5 px-8 pb-8" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="space-y-2">
        <label class="text-sm font-medium text-slate-700" for="email">Email</label>
        <input pInputText id="email" type="email" formControlName="email" placeholder="exemple@email.com" />
        <small class="block text-sm text-red-600" *ngIf="loginForm.controls.email.touched && loginForm.controls.email.invalid">
          Email obligatoire et valide.
        </small>
      </div>

      <div class="space-y-2">
        <label class="text-sm font-medium text-slate-700" for="password">Mot de passe</label>
        <input pInputText id="password" type="password" formControlName="password" placeholder="Votre mot de passe" />
        <small class="block text-sm text-red-600" *ngIf="loginForm.controls.password.touched && loginForm.controls.password.invalid">
          Mot de passe obligatoire.
        </small>
      </div>

      <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage" styleClass="w-full"></p-message>

      <button
        pButton
        type="submit"
        class="w-full"
        icon="pi pi-sign-in"
        [loading]="isLoading"
        label="Se connecter"
      ></button>

      <p class="mb-0 text-center text-sm text-slate-600">
        Pas encore de compte ?
        <a routerLink="/register" class="font-semibold text-slate-900">Créer un compte</a>
      </p>
    </form>
  </p-card>
</main>
